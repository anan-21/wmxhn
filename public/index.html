<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#f7f8fa">
  <title>启航 · 高考志愿 Agent</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <div class="workspace">
    <aside class="left-rail" id="leftRail">
      <div class="brand-block">
        <div class="brand-mark avatar-brand" id="brandAvatar" aria-hidden="true"><img src="/avatar-offline.jpg" alt="当前 Agent 头像"></div>
        <div>
          <div class="brand-name">启航 Agent</div>
          <div class="brand-meta">高考志愿决策</div>
        </div>
      </div>

      <button class="primary-action" type="button" onclick="resetChat()">
        <span aria-hidden="true">＋</span><span>新建咨询</span>
      </button>

      <nav class="history-panel" aria-label="咨询记录">
        <div class="section-heading">
          <span>最近咨询</span>
          <button class="icon-button" type="button" onclick="exportCurrentChat()" title="导出当前咨询" aria-label="导出当前咨询">↓</button>
        </div>
        <div class="history-list" id="historyList"></div>
      </nav>

      <div class="connection-card">
        <label for="providerSelect">模型服务</label>
        <select id="providerSelect" onchange="onProviderChange(this.value)"></select>
        <label for="apiKeyInput">API Key <span>可选</span></label>
        <div class="secret-field">
          <input id="apiKeyInput" type="password" autocomplete="off" placeholder="使用服务端配置" onchange="onApiKeyChange(this.value)">
          <button class="icon-button" type="button" onclick="toggleKeyVisibility()" title="显示或隐藏 API Key" aria-label="显示或隐藏 API Key">◉</button>
        </div>
        <div class="connection-status" id="connectionStatus"><i></i><span>正在检测</span></div>
      </div>
    </aside>

    <main class="agent-main">
      <header class="topbar">
        <button class="icon-button mobile-only" type="button" onclick="toggleLeftRail()" title="打开导航" aria-label="打开导航">☰</button>
        <div class="thread-title">
          <strong id="threadTitle">新咨询</strong>
          <span id="phaseLabel">需求梳理</span>
        </div>
        <div class="topbar-actions">
          <button class="secondary-action" type="button" onclick="openProfileDialog()">填写画像</button>
          <button class="icon-button mobile-only" type="button" onclick="toggleContextPanel()" title="查看学生画像" aria-label="查看学生画像">◎</button>
          <div class="agent-status" id="chatStatus"><i></i><span>就绪</span></div>
        </div>
      </header>

      <section class="conversation" id="chatMessages" aria-live="polite">
        <div class="empty-state" id="welcomeMsg">
          <div class="welcome-avatar" id="welcomeAvatar"><img src="/avatar-offline.jpg" alt="启航 Agent"></div>
          <div class="empty-kicker">GAOKAO DECISION AGENT</div>
          <h1>先说说你的情况</h1>
          <p>分数、位次、省份、选科，知道多少说多少。Agent 会自己补齐问题、查数据并整理方案。</p>
          <div class="starter-grid" id="quickStarters">
            <button type="button" onclick="selectStarter('我是广东物理类考生，600分，位次大约4万，帮我看看学校和专业')">
              <span>已有分数和位次</span><small>直接开始匹配学校</small>
            </button>
            <button type="button" onclick="selectStarter('我还不知道适合什么专业，你先通过提问帮我梳理方向')">
              <span>还没想好专业</span><small>先做方向判断</small>
            </button>
            <button type="button" onclick="selectStarter('家庭条件一般，我更看重就业稳定和投入产出比')">
              <span>优先考虑就业</span><small>从风险和回报出发</small>
            </button>
            <button type="button" onclick="selectStarter('帮我查一下2026年最新的高考志愿政策变化')">
              <span>查询最新政策</span><small>使用联网搜索</small>
            </button>
          </div>
        </div>
      </section>

      <footer class="composer-wrap">
        <div class="composer">
          <textarea id="chatInput" rows="1" maxlength="4000" placeholder="输入你的问题或学生情况…" oninput="resizeComposer(this)" onkeydown="handleComposerKey(event)"></textarea>
          <div class="composer-footer">
            <span id="composerHint">Agent 会按需调用录取库、知识库和联网搜索</span>
            <button class="send-button" id="sendBtn" type="button" onclick="sendMessage()" title="发送" aria-label="发送">↑</button>
          </div>
        </div>
      </footer>
    </main>

    <aside class="context-panel" id="contextPanel">
      <div class="context-header">
        <div>
          <strong>学生画像</strong>
          <span id="profilePercent">0% 完整</span>
        </div>
        <button class="icon-button mobile-only" type="button" onclick="toggleContextPanel()" title="关闭" aria-label="关闭">×</button>
      </div>
      <div class="progress-track"><div id="profileBarFill"></div></div>
      <div class="profile-list" id="profileFields"></div>

      <div class="context-divider"></div>
      <div class="section-heading"><span>Agent 运行记录</span><span class="activity-count" id="activityCount">0</span></div>
      <div class="activity-list" id="activityList">
        <div class="activity-empty">工具调用会显示在这里</div>
      </div>

      <div class="data-boundary">
        <strong>数据边界</strong>
        <p>录取结果仅作决策参考，正式填报前请以省考试院与院校招生章程为准。</p>
      </div>
    </aside>
  </div>

  <dialog id="profileDialog" class="profile-dialog">
    <form method="dialog" onsubmit="submitQuickMode(event)">
      <div class="dialog-header">
        <div><strong>学生画像</strong><span>已知信息可以一次填完</span></div>
        <button class="icon-button" value="cancel" formnovalidate aria-label="关闭">×</button>
      </div>
      <div class="form-grid">
        <label>高考分数<input type="number" id="score" min="200" max="750" placeholder="例如 620" required></label>
        <label>全省位次<input type="number" id="rank" min="1" placeholder="例如 8500"></label>
        <label>省份<select id="province" required><option value="">请选择</option></select></label>
        <label>科类<select id="subject" required><option value="">请选择</option><option value="science">物理类 / 理科</option><option value="arts">历史类 / 文科</option></select></label>
        <label>家庭经济承压能力<select id="family_income"><option value="">请选择</option><option value="low">压力较大</option><option value="medium">普通工薪</option><option value="high">支持长期深造</option></select></label>
        <label>兴趣方向<input type="text" id="interest" placeholder="例如 计算机、医学"></label>
        <label>城市偏好<select id="city_preference"><option value="true">偏好大城市</option><option value="false">城市不限</option></select></label>
        <label>深造计划<select id="postgraduate"><option value="false">暂不确定</option><option value="true">计划考研</option></select></label>
      </div>
      <div class="dialog-actions">
        <button class="secondary-action" value="cancel" formnovalidate>取消</button>
        <button class="primary-action" type="submit">保存并分析</button>
      </div>
    </form>
  </dialog>

  <div class="scrim" id="scrim" onclick="closeMobilePanels()"></div>
  <script src="/app.js"></script>
  <script>
    window.va = window.va || function () { (window.vaq = window.vaq || []).push(arguments); };
  </script>
  <script defer src="/_vercel/insights/script.js"></script>
</body>
</html>
